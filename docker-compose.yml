services:
  ai-devops:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8787:8787"
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      DATABASE_PATH: /app/data/ai-devops.db
    volumes:
      - ai-devops-data:/app/data
    restart: unless-stopped

volumes:
  ai-devops-data:

